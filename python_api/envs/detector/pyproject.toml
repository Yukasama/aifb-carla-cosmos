# Gemeinsame Umgebung fuer BEVHeight++, CoBEV und HeightFormer: alle drei verlangen denselben Stack
# (docs/install.md der Repos). Eigenes uv-Projekt, weil Python 3.8/NumPy 1.19 nicht in die
# CARLA-Umgebung (Python 3.12/NumPy 2) passen. Die Launcher rufen `uv run --project envs/detector` auf.
[project]
name = "detector-env"
version = "0"
requires-python = "==3.8.*"
dependencies = [
    "torch==1.9.0+cu111",
    "torchvision==0.10.0+cu111",
    "mmcv-full==1.4.0",
    "mmdet==2.19.0",
    "mmsegmentation==0.20.0",
    "mmdet3d==0.18.1",
    "pytorch-lightning==1.5.10",
    "numpy==1.19.5",
    "numba==0.48.0",
    "nuscenes-devkit",
    "opencv-python-headless<4.3",
    "pandas",
    "pyquaternion",
    "scikit-image",
    "scipy",
    "setuptools==59.5.0",
    "tensorboardX",
    "pypcd @ git+https://github.com/klintan/pypcd.git",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
find-links = ["https://download.openmmlab.com/mmcv/dist/cu111/torch1.9.0/index.html"]
# mmcv/nuscenes/lyft verlangen opencv-python; beide Pakete schreiben cv2/, nur headless installieren
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[[tool.uv.index]]
name = "pytorch-cu111"
url = "https://download.pytorch.org/whl/cu111"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu111" }
torchvision = { index = "pytorch-cu111" }

# mmdet3d 0.18.1 gibt es nur als sdist, dessen setup.py torch importiert und CUDA-Ops kompiliert:
# Metadaten aus requirements/runtime.txt (v0.18.1), gebaut gegen das torch der Umgebung.
[[tool.uv.dependency-metadata]]
name = "mmdet3d"
version = "0.18.1"
requires-dist = [
    "lyft_dataset_sdk",
    "networkx>=2.2,<2.3",
    "numba==0.48.0",
    "numpy<1.20.0",
    "nuscenes-devkit",
    "plyfile",
    "scikit-image",
    "tensorboard",
    "trimesh>=2.35.39,<2.35.40",
]

[tool.uv.extra-build-dependencies]
mmdet3d = [{ requirement = "torch", match-runtime = true }]
